; Pin to official PlatformIO platform (Arduino ESP32 2.0.x).
; Unversioned "espressif32" resolves to pioarduino 55.x with core 3.x, which breaks AsyncTCP-esphome.
[env]
# Keep the embedded fallback synchronized with src/app_js_spa.h for every build.
extra_scripts = pre:scripts/generate_spa_gzip.py
platform = espressif32@6.12.0

[env:TANGO]
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
lib_deps =
        SPIFFS
        Wire
        adafruit/RTClib@^2.1.4
        WebServer
        ottowinter/ESPAsyncWebServer-esphome@^3.0.0
lib_ldf_mode = deep+
build_flags = 
        -DAUDIOKIT_BOARD=5
        -DSOC_SDMMC_HOST_SUPPORTED
        -DSD_MMC_MODE
        -DBOARD_HAS_PSRAM
        -mfix-esp32-psram-cache-issue
        -DCORE_DEBUG_LEVEL=0
        -DFIRMWARE_PREFIX=\"TANGO\"
        -DTANGO
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
 
[env:ECHO]
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
lib_deps =
        SPIFFS
        Wire
        adafruit/RTClib@^2.1.4
        WebServer
        ottowinter/ESPAsyncWebServer-esphome@^3.0.0
        marvinroger/AsyncMqttClient
lib_ignore = AsyncTCP
lib_ldf_mode = deep+
build_flags = 
        -DAUDIOKIT_BOARD=5
        -DSOC_SDMMC_HOST_SUPPORTED
        -DSD_MMC_MODE
        -DBOARD_HAS_PSRAM
        -mfix-esp32-psram-cache-issue
        -DCORE_DEBUG_LEVEL=0
        -DFIRMWARE_PREFIX=\"ECHO\"
        -DECHO
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
